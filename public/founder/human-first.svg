<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="t d">
<title id="t">Human first, human last</title><desc id="d">A person sits at the centre of ORVIA's evidence and accountability practice.</desc>
<rect width="1600" height="900" fill="#0B2450"/>
<text x="120" y="145" font-family="Arial" font-size="50" font-weight="700" fill="#fff">Human first. Human last.</text>
<text x="120" y="195" font-family="Arial" font-size="24" fill="#dbe7f1">Systems can organise the work. They do not inherit the judgement.</text>
<circle cx="800" cy="470" r="125" fill="#FAF7F2"/>
<circle cx="800" cy="430" r="38" fill="#0B2450"/><path d="M735 540c18-70 112-70 130 0" fill="#0B2450"/>
<g font-family="Arial" font-size="24" font-weight="700" text-anchor="middle">
<circle cx="420" cy="340" r="105" fill="#2B929D"/><text x="420" y="333" fill="#fff">EVIDENCE</text><text x="420" y="365" font-size="18" fill="#eaf7f8">What the record shows</text>
<circle cx="1180" cy="340" r="105" fill="#EAAA00"/><text x="1180" y="333" fill="#0B2450">REVIEW</text><text x="1180" y="365" font-size="18" fill="#0B2450">What it supports</text>
<circle cx="420" cy="640" r="105" fill="#82418F"/><text x="420" y="633" fill="#fff">CHALLENGE</text><text x="420" y="665" font-size="18" fill="#fff">What may be missing</text>
<circle cx="1180" cy="640" r="105" fill="#E74612"/><text x="1180" y="633" fill="#fff">ACTION</text><text x="1180" y="665" font-size="18" fill="#fff">Who does what next</text>
</g>
<g stroke="#fff" stroke-width="5" opacity=".7"><line x1="525" y1="370" x2="690" y2="435"/><line x1="1075" y1="370" x2="910" y2="435"/><line x1="525" y1="610" x2="690" y2="510"/><line x1="1075" y1="610" x2="910" y2="510"/></g>
<text x="800" y="790" text-anchor="middle" font-family="Arial" font-size="26" fill="#fff">AI supports. Authorised humans retain judgement, authority and accountability.</text>
</svg>