<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="t d">
<title id="t">One shared evidence picture</title><desc id="d">Multiple evidence sources flow into one controlled shared record used by connected parties.</desc>
<rect width="1600" height="900" fill="#FAF7F2"/>
<rect x="70" y="70" width="1460" height="760" rx="44" fill="#fff" stroke="#d8e0e8" stroke-width="3"/>
<text x="120" y="150" font-family="Arial" font-size="48" font-weight="700" fill="#0B2450">One shared evidence picture</text>
<text x="120" y="195" font-family="Arial" font-size="24" fill="#506174">Different sources. Same record. Clear provenance. Human judgement retained.</text>
<g font-family="Arial" font-size="22" font-weight="700">
<rect x="120" y="280" width="250" height="90" rx="20" fill="#eef4f8"/><text x="160" y="335" fill="#0B2450">Emails</text>
<rect x="120" y="410" width="250" height="90" rx="20" fill="#eef4f8"/><text x="160" y="465" fill="#0B2450">Case notes</text>
<rect x="120" y="540" width="250" height="90" rx="20" fill="#eef4f8"/><text x="160" y="595" fill="#0B2450">Reports</text>
<rect x="120" y="670" width="250" height="90" rx="20" fill="#eef4f8"/><text x="160" y="725" fill="#0B2450">Calls & meetings</text>
</g>
<g stroke="#2B929D" stroke-width="8" fill="none"><path d="M370 325 C500 325 510 420 620 420"/><path d="M370 455 C500 455 510 455 620 455"/><path d="M370 585 C500 585 510 490 620 490"/><path d="M370 715 C500 715 510 525 620 525"/></g>
<rect x="620" y="300" width="380" height="360" rx="32" fill="#0B2450"/>
<text x="680" y="365" font-family="Arial" font-size="34" font-weight="700" fill="#fff">Controlled evidence record</text>
<g font-family="Arial" font-size="23" fill="#fff">
<circle cx="690" cy="430" r="10" fill="#2B929D"/><text x="720" y="438">Chronology</text>
<circle cx="690" cy="490" r="10" fill="#EAAA00"/><text x="720" y="498">Source provenance</text>
<circle cx="690" cy="550" r="10" fill="#82418F"/><text x="720" y="558">Gaps & disagreement</text>
<circle cx="690" cy="610" r="10" fill="#E74612"/><text x="720" y="618">Actions & ownership</text>
</g>
<g stroke="#EAAA00" stroke-width="8" fill="none"><path d="M1000 430 C1100 430 1100 325 1180 325"/><path d="M1000 470 C1100 470 1100 455 1180 455"/><path d="M1000 510 C1100 510 1100 585 1180 585"/><path d="M1000 550 C1100 550 1100 715 1180 715"/></g>
<g font-family="Arial" font-size="22" font-weight="700">
<rect x="1180" y="280" width="270" height="90" rx="20" fill="#fff7e5" stroke="#EAAA00" stroke-width="2"/><text x="1215" y="335" fill="#0B2450">Family / person</text>
<rect x="1180" y="410" width="270" height="90" rx="20" fill="#edf7f8" stroke="#2B929D" stroke-width="2"/><text x="1215" y="465" fill="#0B2450">Provider team</text>
<rect x="1180" y="540" width="270" height="90" rx="20" fill="#f5eef7" stroke="#82418F" stroke-width="2"/><text x="1215" y="595" fill="#0B2450">Commissioner</text>
<rect x="1180" y="670" width="270" height="90" rx="20" fill="#fff0eb" stroke="#E74612" stroke-width="2"/><text x="1215" y="725" fill="#0B2450">Professional</text>
</g>
